<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-it Digital - Notas Rápidas</title>
    
    <meta name="theme-color" content="#f59e0b">
    <meta name="description" content="Aplicativo simples e intuitivo de post-its digitais com cores, visualização em grade e linha, e salvamento automático.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Post-it Digital">

    <!-- Manifest e Favicons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Frameworks externos (Tailwind CSS e Ícones Lucide) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Estilos customizados -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-full text-slate-800 bg-pattern flex flex-col min-h-screen">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-sm px-4 py-3 sm:px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-yellow-500 flex items-center justify-center text-white shadow-md shadow-yellow-200">
                        <i data-lucide="sticky-note" class="w-6 h-6 stroke-[2.5]"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Post-it Digital</h1>
                        <p class="text-xs text-slate-500 font-medium mt-0.5">Mural de Notas Rápidas</p>
                    </div>
                </div>
                <div class="flex items-center space-x-1 md:hidden">
                    <button id="pwaInstallBtnMobile" onclick="installPWA()" class="hidden p-2 text-amber-600 bg-amber-50 rounded-lg hover:bg-amber-100">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </button>
                    <button onclick="createNewNote()" class="p-2 bg-amber-500 text-white rounded-lg hover:bg-amber-600 shadow-sm">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <div class="relative flex-1 min-w-[180px] max-w-xs">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterNotes()" placeholder="Buscar em suas notas..." 
                           class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-100/80 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-amber-400 rounded-lg outline-none transition duration-150">
                </div>
                <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200/60">
                    <button id="btnViewGrid" onclick="setViewMode('grid')" class="px-3 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 bg-white text-slate-800 shadow-sm">
                        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Blocos</span>
                    </button>
                    <button id="btnViewInline" onclick="setViewMode('inline')" class="px-3 py-1 text-xs font-semibold rounded-lg transition-all flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
                        <i data-lucide="rows-3" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Em Linha</span>
                    </button>
                </div>
                <button onclick="toggleFont()" id="fontToggleBtn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Mudar estilo de fonte">
                    <i data-lucide="type" class="w-4 h-4"></i>
                </button>
                <button onclick="createNewNote()" class="hidden md:flex items-center gap-2 px-4 py-2 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-amber-500/20 transition duration-150">
                    <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
                    <span>Novo Post-it</span>
                </button>
                <button id="pwaInstallBtn" onclick="installPWA()" class="hidden items-center gap-1.5 px-3 py-1.5 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200/80 rounded-xl text-xs font-semibold transition duration-150">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span>Instalar App</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 bg-white p-3 sm:p-4 rounded-2xl border border-slate-200/80 shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Criar na cor:</span>
                <div class="flex items-center gap-1.5" id="colorSelectorContainer"></div>
            </div>
            <div class="flex items-center gap-3 text-xs text-slate-500 font-medium">
                <span id="noteCount">0 post-its</span>
                <span class="text-slate-300">•</span>
                <button onclick="clearAllNotes()" class="text-slate-400 hover:text-red-500 transition">Limpar todos</button>
            </div>
        </div>
        <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 pb-20"></div>
        <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center py-16 px-4">
            <div class="w-20 h-20 bg-amber-100/80 text-amber-600 rounded-3xl flex items-center justify-center mb-4 shadow-inner">
                <i data-lucide="file-plus-2" class="w-10 h-10 stroke-[1.5]"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-800">Nenhum post-it criado ainda</h3>
            <p class="text-sm text-slate-500 max-w-sm mt-1 mb-6">Clique no botão abaixo para adicionar sua primeira nota rápida ao mural.</p>
            <button onclick="createNewNote()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-medium text-sm rounded-xl shadow-lg flex items-center gap-2 transition duration-200">
                <i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i>
                Criar Primeiro Post-it
            </button>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMessage">Ação concluída</span>
    </div>

    <script src="./app.js"></script>
</body>
</html>
